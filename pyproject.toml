[project]
name = "sistema-finacieron"
version = "0.1.0"
description = ""
authors = [
    {name = "Edelynhernandez ",email = "edelinhernandezolano@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel (>=0.0.38,<0.0.39)",
    "pyqt6 (>=6.11.0,<7.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyqtgraph (>=0.14.0,<0.15.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "scraper-bcv (>=0.1.1,<0.2.0)",
    "fpdf2 (>=2.8.7,<3.0.0)"
]

[tool.poetry]
packages = [{include = "sistema_financiero", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-qt (>=4.5.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)",
    "ruff (>=0.11.0,<1.0.0)",
    "mypy (>=1.15.0,<2.0.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PL", "DTZ005", "DTZ011"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
