# Configuración genérica para una sola base de datos.

[alembic]
# Ruta a los scripts de migración.
# Normalmente es una ruta en formato POSIX (ej. barras /)
# relativa al token %(here)s que apunta a la ubicación de este
# archivo ini.
script_location = %(here)s/alembic

# Plantilla usada para generar los nombres de los archivos de migración.
# El valor por defecto es %%(rev)s_%%(slug)s
# Descomenta la línea de abajo si quieres que los nombres incluyan
# fecha y hora. Ver https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# para todos los tokens disponibles.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# O bien organiza en subdirectorios por fecha (requiere recursive_version_locations = true)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Ruta que se agrega a sys.path si está presente.
# Por defecto usa el directorio de trabajo actual.
# Para múltiples rutas, el separador se define con "path_separator" más abajo.
prepend_sys_path = .

# Zona horaria a usar al renderizar la fecha dentro del archivo
# de migración, así como en el nombre del archivo.
# Si se especifica, requiere la librería tzdata (instalar con
# `alembic[tz]` en pip).
# El valor se pasa a ZoneInfo()
# Deja en blanco para usar la hora local.
# timezone =

# Longitud máxima de caracteres para el campo "slug"
# truncate_slug_length = 40

# Cambiar a 'true' para ejecutar el entorno durante
# el comando 'revision', independientemente de autogenerate.
# revision_environment = false

# Cambiar a 'true' para permitir archivos .pyc y .pyo
# sin su archivo .py fuente como revisiones en el
# directorio versions/.
# sourceless = false

# Especificación de ubicación de versiones. Por defecto
# apunta a <script_location>/versions. Cuando se usan
# múltiples directorios de versiones, las revisiones iniciales
# deben especificarse con --version-path.
# El separador de ruta debe coincidir con "path_separator" más abajo.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# Separador de ruta. Indica qué carácter se usa para dividir
# listas de rutas, incluyendo version_locations y prepend_sys_path
# dentro de archivos configparser como alembic.ini.
# El valor por defecto en archivos nuevos es "os", que usa
# os.pathsep para el separador propio del sistema operativo.
#
# Nota: para mantener compatibilidad con archivos antiguos,
# este valor por defecto NO aplica si path_separator no está
# presente en alembic.ini. Si se omite esta opción, la lógica
# de respaldo es:
#
# 1. El parseo de version_locations usa la clave antigua
#    "version_path_separator", y si falta, usa el comportamiento
#    antiguo de dividir por espacios y/o comas.
# 2. El parseo de prepend_sys_path usa el comportamiento antiguo
#    de dividir por espacios, comas o dos puntos.
#
# Valores válidos para path_separator:
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Usa os.pathsep. Configuración por defecto en proyectos nuevos.
path_separator = os

# Cambiar a 'true' para buscar archivos fuente recursivamente
# en cada directorio de "version_locations".
# Nuevo en Alembic versión 1.10.
# recursive_version_locations = false

# Codificación de salida usada al escribir archivos de revisión
# desde script.py.mako.
# output_encoding = utf-8

# URL de la base de datos. Solo la usa el script env.py (mantenido
# por el usuario). Otras formas de configurar la URL pueden
# personalizarse dentro del archivo env.py.
sqlalchemy.url = sqlite:///./database/database.db


[post_write_hooks]
# post_write_hooks define scripts o funciones Python que se
# ejecutan sobre los archivos de revisión recién generados.
# Ver la documentación para más detalle y ejemplos.

# Formatear con "black" - usa console_scripts runner contra el entrypoint "black"
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Linter con intentos de corrección usando "ruff" - usa el module runner
# contra el módulo "ruff"
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Alternativamente, usa el exec runner para ejecutar un binario
# que esté en tu PATH.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Configuración de logging. Solo la usa el script env.py
# (mantenido por el usuario).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
